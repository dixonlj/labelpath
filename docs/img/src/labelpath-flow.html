<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How LabelPath works</title>
<style>
  @font-face {
    font-family: Inter;
    src: url("file:///usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #F4F7F8;
  }
  svg {
    display: block;
    font-family: Inter, "Noto Sans", "DejaVu Sans", Arial, sans-serif;
    text-rendering: geometricPrecision;
    shape-rendering: geometricPrecision;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1280" viewBox="0 0 2400 1280">
  <defs>
    <filter id="cardShadow" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2545" flood-opacity="0.10"/>
    </filter>
    <filter id="innerShadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B2545" flood-opacity="0.06"/>
    </filter>

      <clipPath id="quoteClip"><rect x="1036" y="824" width="1208" height="96" rx="10" ry="10"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect width="2400" height="1280" fill="#F4F7F8"/>
  <rect width="2400" height="6" fill="#0E7C7B"/>

  <!-- title -->
  <text x="80" y="100" fill="#0B2545" font-size="68" font-weight="800" letter-spacing="-1.2">How LabelPath works</text>
  <text x="80" y="160" fill="#5A6B7C" font-size="32" font-weight="400">From public FDA drug labels to a sourced answer</text>

  <!-- ===== Row 1: steps 1–3 ===== -->
  <!-- card 1 -->
  <rect x="80" y="212" width="700" height="280" rx="20" ry="20" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="144" cy="280" r="32" fill="#0E7C7B"/>
  <text x="144" y="280" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="700">1</text>
  <text x="196" y="293" fill="#0B2545" font-size="36" font-weight="650">Public FDA drug labels</text>
  <text x="196" y="372" fill="#5A6B7C" font-size="28" font-weight="400">
    <tspan x="196" dy="0">An openFDA snapshot of</tspan>
    <tspan x="196" dy="38">official drug label text.</tspan>
  </text>

  <!-- card 2 -->
  <rect x="850" y="212" width="700" height="280" rx="20" ry="20" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="914" cy="280" r="32" fill="#0E7C7B"/>
  <text x="914" y="280" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="700">2</text>
  <text x="966" y="269" fill="#0B2545" font-size="36" font-weight="650">
    <tspan x="966" dy="0">LabelPath pulls out</tspan>
    <tspan x="966" dy="44">what the labels say</tspan>
  </text>
  <text x="966" y="372" fill="#5A6B7C" font-size="28" font-weight="400">
    <tspan x="966" dy="0">Drugs, ingredients, and</tspan>
    <tspan x="966" dy="38">label mentions.</tspan>
  </text>

  <!-- card 3 -->
  <rect x="1620" y="212" width="700" height="280" rx="20" ry="20" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="1684" cy="280" r="32" fill="#0E7C7B"/>
  <text x="1684" y="280" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="700">3</text>
  <text x="1736" y="269" fill="#0B2545" font-size="36" font-weight="650">
    <tspan x="1736" dy="0">Stores them as</tspan>
    <tspan x="1736" dy="44">connected facts</tspan>
  </text>
  <text x="1736" y="372" fill="#5A6B7C" font-size="28" font-weight="400">
    <tspan x="1736" dy="0">In a Relate graph that lives</tspan>
    <tspan x="1736" dy="38">on your computer.</tspan>
  </text>


  <!-- ===== Row 2: steps 4–5 ===== -->
  <!-- card 4 -->
  <rect x="80" y="560" width="800" height="520" rx="20" ry="20" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="144" cy="628" r="32" fill="#0E7C7B"/>
  <text x="144" y="628" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="700">4</text>
  <text x="196" y="640" fill="#0B2545" font-size="36" font-weight="650">You ask a question</text>

  <!-- question panel, like a query field -->
  <rect x="116" y="704" width="728" height="200" rx="14" ry="14" fill="#F7FAFA" stroke="#D5DEE4" stroke-width="1.5"/>
  <text x="160" y="776" fill="#0B2545" font-size="40" font-weight="600">
    <tspan x="160" dy="0">Does apixaban's label</tspan>
    <tspan x="160" dy="52">mention aspirin?</tspan>
  </text>

  <!-- card 5 -->
  <rect x="960" y="560" width="1360" height="520" rx="20" ry="20" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="1024" cy="628" r="32" fill="#0E7C7B"/>
  <text x="1024" y="628" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="28" font-weight="700">5</text>
  <text x="1076" y="618" fill="#0B2545" font-size="36" font-weight="650">
    <tspan x="1076" dy="0">You get the exact label quote</tspan>
    <tspan x="1076" dy="44">and its source link</tspan>
  </text>

  <!-- answer inner app card -->
  <rect x="1000" y="704" width="1280" height="340" rx="14" ry="14" fill="#FFFFFF" stroke="#D5DEE4" stroke-width="1.5" filter="url(#innerShadow)"/>
  <text x="1036" y="752" fill="#0B2545" font-size="32" font-weight="600">The apixaban label mentions aspirin.</text>
  <text x="1036" y="796" fill="#5A6B7C" font-size="24" font-weight="500">From the drug interactions section:</text>

  <!-- quote callout -->
  <rect x="1036" y="824" width="1208" height="96" rx="10" ry="10" fill="#F3F8F8"/>
  <rect x="1036" y="824" width="6" height="96" fill="#0E7C7B" clip-path="url(#quoteClip)"/>
  <text x="1064" y="862" fill="#142033" font-size="28" font-weight="400">
    <tspan x="1064" dy="0">“Coadministration of antiplatelet agents, fibrinolytics, heparin,</tspan>
    <tspan x="1064" dy="40">aspirin, and chronic NSAID use increases the risk of bleeding.”</tspan>
  </text>

  <line x1="1036" y1="936" x2="2244" y2="936" stroke="#E6EEF1" stroke-width="1.5"/>
  <text x="1036" y="968" fill="#0E7C7B" font-size="22" font-weight="500">
    <tspan x="1036" dy="0">Source: official FDA label on DailyMed</tspan>
    <tspan x="1036" dy="26">(snapshot; current label may differ)</tspan>
  </text>

  <!-- arrows: 1→2, 2→3, 3→4 (elbow), 4→5; each tip/tail sits on a box edge -->
  <line x1="780" y1="352" x2="834" y2="352" stroke="#0E7C7B" stroke-width="5" stroke-linecap="round"/><path d="M832 343 L850 352 L832 361 Z" fill="#0E7C7B"/>
  <line x1="1550" y1="352" x2="1604" y2="352" stroke="#0E7C7B" stroke-width="5" stroke-linecap="round"/><path d="M1602 343 L1620 352 L1602 361 Z" fill="#0E7C7B"/>
  <path d="M1970 492 L1970 506 Q1970 518 1958 518 L492 518 Q480 518 480 530 L480 544"
        fill="none" stroke="#0E7C7B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M471 542 L480 560 L489 542 Z" fill="#0E7C7B"/>
  <line x1="880" y1="820" x2="944" y2="820" stroke="#0E7C7B" stroke-width="5" stroke-linecap="round"/><path d="M942 811 L960 820 L942 829 Z" fill="#0E7C7B"/>

  <!-- footer -->
  <text x="80" y="1148" fill="#0B2545" font-size="32" font-weight="650">Public openFDA data - educational only, not medical advice.</text>
  <text x="80" y="1190" fill="#5A6B7C" font-size="24" font-weight="400">A path follows label mentions hop by hop; it is not a pharmacological pathway or a clinical finding.</text>
  <text x="80" y="1226" fill="#5A6B7C" font-size="24" font-weight="400">Data provided by the U.S. Food and Drug Administration (https://open.fda.gov).</text>
</svg>
</body>
</html>
